[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/set_project_dirs.py
lib_extra_dirs = esp32cam/lib
; PSRAM is required for the camera frame buffer on the AI-Thinker board
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    esp32-camera

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/set_project_dirs.py
lib_extra_dirs = esp8266/lib
lib_deps =
    arduino-libraries/Stepper@^1.1.3